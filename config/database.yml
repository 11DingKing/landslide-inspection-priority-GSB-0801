# PostgreSQL. Versions 9.5 and up are supported.
#
# Local setup (macOS / Homebrew):
#   gem install pg -- --with-pg-config=/opt/homebrew/bin/pg_config
#
# Connection defaults assume a locally running PostgreSQL reachable over
# localhost with a superuser role named "postgres" (the Homebrew default).
# Override any value with the matching PG* env var or a full DATABASE_URL
# without editing this file.
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("PGUSER", "postgres") %>
  host: <%= ENV.fetch("PGHOST", "localhost") %>
  port: <%= ENV.fetch("PGPORT", 5432) %>
  <% if ENV["PGPASSWORD"].present? %>
  password: <%= ENV["PGPASSWORD"] %>
  <% end %>

development:
  <<: *default
  database: landslide_priority_development

test:
  <<: *default
  database: landslide_priority_test

production:
  <<: *default
  database: landslide_priority_production
  username: <%= ENV.fetch("PGUSER", "landslide_priority") %>
  password: <%= ENV["LANDSLIDE_PRIORITY_DATABASE_PASSWORD"] %>
